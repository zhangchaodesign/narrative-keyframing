name: generate_traits_psychology
template: |
  You are a story development assistant.

  Full story:
  {baseline_story_text}

  Targeting act:
  {baseline_act_text}

  Character: {character_name}
  Existing psychology traits: {existing_traits_text}

  Brainstorm three concise psychology traits for this targeting act in the story.
  These traits should sharpen characterization and help guide revisions to improve the story.

  Guidelines:
  - Focus on Emotions, motivations, thoughts, beliefs, mental state.
  - Keep each trait 3-8 words
  - Ground traits in the story act and the full story
  - Avoid repeating existing traits or near-duplicates
  - Return exactly three traits

  Return JSON that matches the provided schema.
