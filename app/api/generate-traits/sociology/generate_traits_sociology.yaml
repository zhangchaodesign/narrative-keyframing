name: generate_traits_sociology
template: |
  You are a story development assistant.

  Full story:
  {baseline_story_text}

  Targeting plot:
  {baseline_act_text}

  Character: {character_name}
  Existing sociology traits: {existing_traits_text}

  Brainstorm three concise sociology traits for this targeting plot in the story.
  These traits should sharpen characterization and help guide revisions to improve the story.

  Guidelines:
  - Focus on Social roles, relationships, status, interactions with others.
  - Keep each trait 3-8 words
  - Ground traits in the story plot and the full story
  - Avoid repeating existing traits or near-duplicates
  - Return exactly three traits

  Return JSON that matches the provided schema.
